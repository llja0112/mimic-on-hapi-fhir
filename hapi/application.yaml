# Overrides for the HAPI FHIR JPA starter, running against Neon Postgres.
# spring.datasource.url/username/password are NOT set here: provide them as
# SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD.
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    hikari:
      # Small Neon computes have low connection limits
      maximum-pool-size: 10
      minimum-idle: 2
      # Neon drops some long-lived connections; ping idle ones and recycle often
      keepalive-time: 60000
      max-lifetime: 300000
  jpa:
    properties:
      hibernate:
        dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgresDialect
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

hapi:
  fhir:
    fhir_version: R4
    # Off by default; docker-compose.neon.yml turns it on for loading data
    bulk_import_enabled: false
    enforce_referential_integrity_on_write: false
    enforce_referential_integrity_on_delete: false
    narrative_enabled: false
    mdm_enabled: false
    graphql_enabled: false
